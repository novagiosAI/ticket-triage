[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-triage"
version = "0.1.0"
description = "Multilingual ITSM ticket classifier (French, Arabic, Darija) trained entirely on synthetic data — CPU-only, with a public demo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["itsm", "glpi", "ticket-classification", "arabic", "darija", "multilingual", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Arabic",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "glpi-testkit>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]
demo = ["gradio>=4.0"]

[project.scripts]
ticket-triage = "ticket_triage.cli:main"

[project.urls]
Homepage = "https://github.com/novagiosAI/ticket-triage"
Repository = "https://github.com/novagiosAI/ticket-triage"
Issues = "https://github.com/novagiosAI/ticket-triage/issues"
Changelog = "https://github.com/novagiosAI/ticket-triage/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The long lines in the demo are Markdown table rows; they cannot be wrapped
# without breaking the table.
"app.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ticket_triage"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "gradio.*"]
ignore_missing_imports = true
