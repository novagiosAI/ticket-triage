name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # glpi-testkit is not on PyPI yet: install it from its repository so the
      # dependency resolves. Harmless once it is published; publish.yml keeps the
      # PyPI-only install on purpose, so a release cannot ship an uninstallable
      # dependency.
      - run: pip install "glpi-testkit @ git+https://github.com/novagiosAI/glpi-testkit.git"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=ticket_triage --cov-report=term-missing
